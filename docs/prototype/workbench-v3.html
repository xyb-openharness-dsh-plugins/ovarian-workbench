function ovarianAscitesPage(){return `<section class="card"><h2>最近腹部有什么变化？</h2><p>只记录你觉得值得带去复诊的变化。可以不量腹围，也可以只写一句话。</p><form id="ascitesForm"><div class="grid2"><label class="field">日期<input name="date" type="date" value="2026-10-17"></label><label class="field">今天更接近<select name="change"><option>腹胀或腹围感觉变化</option><option>吃一点就饱 / 进食变少</option><option>平卧或活动时不舒服</option><option>体重有变化</option><option>没有特别变化，只整理一份材料</option></select></label></div><label class="field">想记下的情况（可跳过）<textarea name="note" placeholder="例如：最近吃一点就饱，想在复诊时提一下。"></textarea></label><div class="grid2"><label class="field">体重（可选）<input name="weight" type="number" step="0.1" placeholder="kg"></label><label class="field">腹围（可选）<input name="girth" type="number" step="0.1" placeholder="cm；不量也可以"></label></div><div class="grid2"><label class="field">如果记录腹围，测量位置（可选）<input name="girthLocation" placeholder="例如肚脐水平；不确定可留空"></label><label class="field">穿刺/引流材料（可选，按报告原文）<input name="procedure" placeholder="日期、报告记载的量或原文摘要"></label></div>${btn('保留这条身体变化','save-ascites','primary','type="button"')}</form><div class="note">这里记录的是本人描述和资料原文，不判断是否有腹水、病情变化或穿刺时机。体重/腹围不会自动解释为营养改善或恶化。</div></section><section class="card"><h2>我保留的记录</h2>${ui.ascitesEntries.length?ui.ascitesEntries.map(x=>`<div class="line-row"><div><strong>${esc(x.date)} · ${esc(x.change)}</strong><div class="small muted">${esc(x.note||'未补充描述')}${x.weight?' · 体重 '+esc(x.weight)+' kg':''}${x.girth?' · 自测腹围 '+esc(x.girth)+' cm':''}${x.procedure?' · 材料：'+esc(x.procedure):''}</div></div>${pill('本人自述')}</div>`).join(''):'<div class="empty">还没有记录；空白不代表没有症状。</div>'}${btn('放到病情一图秀回顾','navigate','quiet small','data-page="onepage"')}</section>`}
function ovarianBowelPage(){return `<section class="card"><h2>手术后，哪些变化影响了日常生活？</h2><p>可以记录排便或造口带来的困扰，也可以只查看团队给过的材料。没做过造口就不用填写造口内容。</p><form id="bowelForm"><div class="grid2"><label class="field">日期<input name="date" type="date" value="2026-10-17"></label><label class="field">我想记下<select name="topic"><option>排便次数或规律变化</option><option>急迫感或外出安排受影响</option><option>造口渗漏或更换用品的困扰</option><option>造口周围皮肤让我担心</option><option>目前没有特别变化，只准备问题</option></select></label></div><label class="field">对生活的影响（可跳过）<textarea name="concern" placeholder="例如：最近不太敢出门，想问团队有哪些支持。"></textarea></label><details><summary>如果我有造口，想补充（均可跳过）</summary><div class="grid2" style="margin-top:14px"><label class="field">病历或团队怎么称呼造口类型？<input name="ostomyType" placeholder="按原文；不清楚可留空"></label><label class="field">已有的院方/造口护理材料名称或来源<input name="careSource" placeholder="只记录来源，不在此生成护理步骤"></label></div></details>${btn('保留这条生活影响记录','save-bowel','primary','type="button"')}</form><div class="note">这里只保留你的描述和问题，不判断原因、不做严重度评分，也不自动给换袋、饮食或药物建议。需要联系团队时，以院方提供的具体联系安排为准。</div></section><section class="card"><h2>我保留的记录</h2>${ui.bowelEntries.length?ui.bowelEntries.map(x=>`<div class="line-row"><div><strong>${esc(x.date)} · ${esc(x.topic)}</strong><div class="small muted">${esc(x.concern||'未补充描述')}${x.ostomyType?' · 造口类型原文：'+esc(x.ostomyType):''}${x.careSource?' · 材料：'+esc(x.careSource):''}</div></div>${pill('本人自述')}</div>`).join(''):'<div class="empty">还没有记录；可以只保留一个要问团队的问题。</div>'}${btn('放到病情一图秀回顾','navigate','quiet small','data-page="onepage"')}</section>`}
function ovarianGeneticPage(){return `<div class="grid2"><section class="card"><h2>先按报告原样记下结果</h2><p>如果你愿意，可以记录报告类型和原文分类。看不懂或暂时不想处理，也可以先跳过。</p><form id="geneticForm"><div class="grid2"><label class="field">检测类型<select name="testType"><option>还不清楚</option><option>胚系（血液/唾液等样本，按报告）</option><option>肿瘤组织/体细胞检测</option><option>报告未说明</option></select></label><label class="field">报告分类（照报告选择）<select name="classification"><option>尚未核对</option><option>致病 / 可能致病（报告原文）</option><option>意义未明（VUS）</option><option>未检出 / 阴性（报告原文）</option><option>未检测 / 结果未出 / 检测失败</option></select></label></div><label class="field">基因或报告中的原文（可选）<textarea name="reportText" placeholder="可以只记报告名称、日期或原文；不要填写家属姓名/信息。"></textarea></label><label class="field">我想准备的问题（可选）<textarea name="question" placeholder="例如：这个结果与正在讨论的治疗有什么关系？是否适合约遗传咨询？"></textarea></label>${btn('保留这条报告记录','save-genetic','primary','type="button"')}</form><div class="note">胚系与体细胞结果不能混为一类；VUS不等于致病结果。这个页面不计算家属风险、不推荐检测，也不会通知或共享给家人。</div></section><section class="card"><h2>可以带去咨询的问题</h2><div class="choice-list"><button class="choice" data-action="genetic-question" data-question="我想请专业人员解释报告分类、检测方法和仍不确定的部分。"><span>请解释报告分类和还不确定的部分</span><span>＋</span></button><button class="choice" data-action="genetic-question" data-question="如果我想了解这份报告对家人可能意味着什么，应向遗传咨询人员问哪些问题？"><span>如果我担心家人，可以先问什么？</span><span>＋</span></button><button class="choice" data-action="genetic-question" data-question="我想了解遗传咨询的流程、适用范围和费用应如何核实。"><span>咨询流程和费用怎么核实？</span><span>＋</span></button></div><div class="note">家庭相关讨论完全自愿。问题清单不会记录家属身份，也不是对亲属进行筛查/检测的建议。</div></section></div><section class="card"><h2>最近保留的遗传咨询问题</h2>${ui.geneticQuestions.length?ui.geneticQuestions.map(q=>`<div class="line-row">${esc(q)}</div>`).join(''):'<div class="empty">还没有问题；也可以先不讨论。</div>'}</section>`}
function clinical(){let body='';const t=ui.clinicalTab;if(t==='腹部与穿刺')body=ovarianAscitesPage();if(t==='术后排便/造口')body=ovarianBowelPage();if(t==='遗传报告')body=ovarianGeneticPage();if(t==='治疗历程')body=`<section class="card"><h2>计划与实际，分开记</h2><div class="history">${[['09-03','已记录的治疗事件','演示方案；无具体剂量，不代表治疗建议','ok'],['09-24','已记录的治疗事件','演示方案；可与同时间窗检测对照','ok'],['10-15','治疗计划 · 实际未提供','不能因预约已完成就写成已给药','draft']].map(([date,title,desc,kind])=>`<div class="history-row"><span class="small muted">2026<br>${date}</span><span class="dot"></span><div class="body"><div class="row"><strong>${title}</strong>${pill(kind==='ok'?'已接受转录':'计划',kind)}</div><p class="small muted">${desc}</p>${btn('查看事件与来源','treatment-detail','quiet small',`data-id="${date==='09-03'?'d4':date==='09-24'?'d5':'d3'}"`)}</div></div>`).join('')}</div>${btn('看看同时间窗指标','navigate','small',`data-page="onepage"`)}</section>`;
if(t==='临床档案')body=`<div class="grid2"><section class="card"><h2>病理与分子检测资料</h2>${[['原发部位','卵巢 · 模拟已接受转录'],['病理类型','上皮性 · 演示值'],['胚系 BRCA','未提供'],['肿瘤体细胞检测','未提供'],['HRD','未提供；不等于阴性'],['IHC','未提供']].map(([k,v])=>`<div class="line-row"><span>${k}</span><span class="muted">${v}</span></div>`).join('')}</section><section class="card"><h2>不同结果，保留不同含义</h2><p class="muted">未检测、未检出、检测失败、VUS和未知，不合并成一个“阴性”。</p><div class="note">样本、方法、报告日期及原文出处需要一起保留。界面调整不会另建一份档案。</div>${btn('打开病情档案','diagnosis','quiet')}</section></div>`;
if(t==='试验检索')body=`<section class="card"><h2>查找登记线索</h2><div class="row"><div class="field" style="flex:1;margin:0"><label for="trialQuery" class="small">关键词 / 登记号</label><input id="trialQuery" placeholder="输入关键词（仅模拟搜索）"></div>${btn('检索模拟条目','search-trial','primary')}</div><div class="note">原型只有一条虚构登记记录，不可用于联络或入组判断。</div><div id="trialResults"><div class="line-row"><div><strong>卵巢相关上皮性癌 · 模拟研究条目</strong><div class="small muted">DEMO-001 · 无真实研究中心 · 演示快照</div></div>${btn('查看登记详情','trial-detail','small')}</div></div></section>`;
if(t==='资料对照')body=`<section class="card"><h2>准备向研究中心核实的问题</h2><p class="small muted">DEMO-001 · 虚构登记条件；不是匹配率或入组判断。</p><table><tr><th>条件原文（模拟）</th><th>相关资料</th><th>待核实</th></tr><tr><td>组织学要求</td><td>已有模拟病理资料</td><td>由中心解释适用性</td></tr><tr><td>既往治疗要求</td><td>实际/计划需区分</td><td>需补实际用药记录</td></tr><tr><td>检测要求</td><td>报告未提供</td><td>不能视为阴性或不符合</td></tr></table>${btn('保留一个核实问题','trial-question','quiet')}</section>`;
if(t==='我的关注')body=`<section class="card"><h2>我的研究线索</h2>${ui.trialSaved?`<div class="line-row"><span>DEMO-001 · 收藏时的模拟快照</span>${btn('查看详情','trial-detail','small')}</div>`:'<div class="empty">还没有关注条目。检索后可收藏并记录要核实的条件。</div>'}</section>`;
if(t==='数据来源')body=`<section class="card"><h2>本原型的数据来源</h2><p>临床试验页面使用虚构条目，没有真实招募状态或联系人。</p><p class="muted">正式实现须提供登记平台、条目URL、原登记更新日期、采集时间、数据包版本和维护责任。</p>${btn('查看癌种指南范围','scope','quiet')}</section>`;
if(t==='治疗历程')body+=ovarianTopicCards(); return heading('临床','从你正在经历的事情开始：治疗讨论、身体变化、报告，或一个想问的问题。')+tabs(['治疗历程','临床档案','腹部与穿刺','术后排便/造口','遗传报告','试验检索','资料对照','我的关注','数据来源'],t,'clinical')+body}
function nutrition(){
 const tab=ui.nutritionTab||'当下困扰';let body='';
 if(tab==='当下困扰')body=`<div class="grid2"><section class="card"><span class="eyebrow">从现在最难的一点开始</span><h2 style="margin-top:8px">吃东西或维持体力，最近遇到什么？</h2><p>不用计算每一餐，也不必一次填完。选一个困扰，可以只记录一句话。</p><div class="choice-list">${[['胃口变差或吃一点就饱','早饱/胃口'],['恶心、呕吐或口腔不舒服','恶心/口腔'],['腹胀、排便或造口影响进食','腹部/排便'],['体重变化或担心营养不足','体重/营养'],['想记录已经得到的营养建议','专业建议']].map(([label,topic])=>`<button class="choice" data-action="nutrition-topic" data-topic="${topic}"><span>${label}</span><span>→</span></button>`).join('')}</div><p class="small muted">这些变化可能有多种原因；本页只帮你记录和准备沟通，不判断病因或开营养处方。</p></section><section class="card"><h2>这次我想先做的事</h2>${ui.nutritionTopic?`<div class="note">你选择了：${esc(ui.nutritionTopic)}。可以写下一句话，或先保存一条进食记录。</div>`:'<p class="muted">你可以从记录胃口、体重或已获得的建议开始。也可以先不记录。</p>'}${btn('记录进食和体重','tab','primary','data-kind="nutrition" data-tab="进食与体重"')}${btn('查看建议与回顾','tab','quiet','data-kind="nutrition" data-tab="建议与回顾"')}${ui.support.length?`<p class="small muted">已保存 ${ui.support.length} 条营养/进食记录。</p>`:''}</section></div>`;
 else if(tab==='进食与体重')body=`<div class="grid2"><section class="card"><h2>今天，记一点就好</h2><p>日期、胃口、体重或一句话，任选其一；估算值会明确标记。</p><form id="nutritionForm"><div class="grid2"><label class="field">日期<input name="date" type="date" value="2026-10-17" required></label><label class="field">胃口<select name="appetite"><option>暂不记录</option><option>和平常差不多</option><option>比平常少一些</option><option>吃一点就饱</option></select></label></div><label class="field">进食困难（可选）<select name="barrier"><option value="">暂不记录</option><option>恶心或呕吐</option><option>腹胀或早饱</option><option>排便变化</option><option>口腔不适</option><option>其他</option></select></label><div class="grid2"><label class="field">体重 kg（可选）<input name="weight" type="number" step="0.1" min="1" max="400" placeholder="不填也可以"></label><label class="field">体重 / 进食的补充背景（可选）<input name="context" placeholder="例如近期引流；按本人记录"></label></div><div class="grid2"><label class="field">能量估算 kcal（可选）<input name="energy" type="number" min="0" placeholder="估算时需标记"></label><label class="field">蛋白质估算 g（可选）<input name="protein" type="number" min="0" step="0.1" placeholder="未知可留空"></label></div><label class="field">想让团队知道的话（可选）<textarea name="note" maxlength="500" placeholder="可以只写一项，不需要解释原因"></textarea></label>${btn('保留这条记录','save-nutrition','primary','type="button"')}</form><div class="note">体重升降不自动代表营养改善或恶化；不填的摄入量保持未知，不记为零。</div></section><section class="card"><h2>近期进食与体重记录</h2>${ui.support.length?ui.support.map((x,i)=>`<div class="line-row"><div><strong>${esc(x.date)} · ${esc(x.appetite||'进食情况未填')}</strong><div class="small muted">${x.weight?'体重 '+esc(x.weight)+' kg · ':''}${x.energy?'估算 '+esc(x.energy)+' kcal · ':''}${x.protein?'蛋白质估算 '+esc(x.protein)+' g · ':''}${esc(x.note||x.barrier||x.context||'无补充描述')}</div></div>${btn('查看','nutrition-detail','quiet small',`data-index="${i}"`)}${btn('删除','remove-nutrition','quiet small',`data-index="${i}"`)}</div>`).join(''):'<div class="empty">尚无记录。不记录也不影响其他功能。</div>'}<div class="note">营养记录会以单独事件出现在病情一图秀；不会自动解释成营养状态结论。</div></section></div>`;
 else body=`<div class="grid2"><section class="card"><h2>记下已获得的专业建议</h2><p>只转记团队或营养专业人员实际提供的内容和出处；本页面不自动生成建议。</p><form id="nutritionAdviceForm"><div class="grid2"><label class="field">日期<input name="date" type="date" value="2026-10-17" required></label><label class="field">建议来源（可选）<input name="source" placeholder="例如：营养门诊 / 出院材料"></label></div><label class="field">建议内容（可写摘要或原文）<textarea name="advice" maxlength="1000" placeholder="不确定或记不清的部分可以留空"></textarea></label><div class="grid2"><label class="field">营养制剂名称（可选）<input name="product" placeholder="按实际包装/专业建议记录"></label><label class="field">实际使用量（可选）<input name="actualUse" placeholder="记录实际情况，不生成剂量建议"></label></div>${btn('保留这条建议记录','save-nutrition-advice','primary','type="button"')}</form></section><section class="card"><h2>建议与营养制剂回顾</h2>${ui.nutritionAdvice.length?ui.nutritionAdvice.map((x,i)=>`<div class="line-row"><div><strong>${esc(x.date)} · ${esc(x.source||'来源未填')}</strong><div class="small muted">${esc(x.advice||'未补充建议')}${x.product?' · '+esc(x.product):''}${x.actualUse?' · 实际使用 '+esc(x.actualUse):''}</div></div>${btn('删除','remove-nutrition-advice','quiet small',`data-index="${i}"`)}</div>`).join(''):'<div class="empty">还没有保存专业建议或营养制剂记录。</div>'}<div class="note">用量字段只保留你实际记录的内容，不代表推荐剂量。</div>${btn('整理一个营养问题','assist-nutrition','quiet small')}</section></div>`;
 return heading('营养支持','从当下困扰到进食、体重和专业建议，按你需要的部分慢慢整理。',btn('整理我的营养问题','assist-nutrition','small'))+tabs(['当下困扰','进食与体重','建议与回顾'],tab,'nutrition')+body;
}
function mind(){
 const tab=ui.mindTab||'当下感受';let body='';
 if(tab==='当下感受')body=`<div class="notice pink">私密空间 · 记录默认不进入一图秀、Agent任务、复诊摘要或导出。</div><div class="grid2"><section class="card"><h2>此刻，想先得到哪种帮助</h2><div class="choice-list"><button class="choice" data-action="mind-support"><span>有些担心，想先理一理</span><span>→</span></button><button class="choice" data-action="mind-resources"><span>想知道可以向谁求助</span><span>→</span></button></div><div class="section-head"><h2>也可以只为自己记一笔</h2>${pill('默认私密','private')}</div><form id="moodForm"><label class="field">记录主体<select name="subject"><option>患者本人</option><option>照护者自己</option></select></label><label class="field">感受、睡眠、担心或想得到的帮助<textarea name="note" maxlength="1000" placeholder="可以只写一句，也可以先不写"></textarea></label>${btn('私密保存','save-mood','primary','type="button"')}</form><p class="muted small">没有打卡要求。私密记录不会因为由照护者代管资料就变成患者的感受。</p></section><section class="card"><h2>需要时再看其他内容</h2><p>我的记录、支持资源、身体与亲密话题都有独立入口。</p>${btn('打开我的记录','tab','quiet','data-kind="mind" data-tab="我的记录"')}${btn('身体与亲密','tab','quiet','data-kind="mind" data-tab="身体与亲密"')}</section></div>`;
 else if(tab==='我的记录')body=`<section class="card"><div class="section-head"><div><h2>只留给记录主体的内容</h2><p class="small muted">患者与照护者各自的感受分开保存。</p></div>${pill('私密','private')}</div>${ui.moods.length?ui.moods.map((m,i)=>`<div class="line-row"><div><strong>${esc(m.subject)}${m.topic?' · '+esc(m.topic):''}</strong><div>${esc(m.note)}</div><div class="muted small">私密 · 未选入任何摘要</div></div>${btn('删除','remove-mood','quiet small',`data-index="${i}"`)}</div>`).join(''):'<div class="empty"><h3>这里还没有记录</h3><p>不记录也可以使用其他帮助。</p></div>'}<div class="note">授权解释某条记录，不等于同意将其放入共同复诊材料。</div>${btn('记下一条私密感受','tab','quiet','data-kind="mind" data-tab="当下感受"')}</section>`;
 else if(tab==='支持资源')body=`<div class="grid2"><section class="card"><h2>我希望别人怎样帮我</h2><p>可以从一件具体的事开始：陪同就诊、帮忙整理材料，或听我说一会儿。</p>${btn('保留一个求助问题','support-question','primary')}</section><section class="card"><h2>本地支持资源</h2><p>当前原型未核实医院心理服务、患者互助组织或热线的地区覆盖、开放时间和联系方式。</p><div class="note">正式上线前需逐条核实服务提供方、适用地区、开放时间、更新日期及失效处理；此原型不显示未经核实的可联系服务。</div>${btn('查看资源设计说明','resource-info','quiet')}</section></div>`;
 else body=`<div class="notice pink">这些话题默认私密。你可以只看标题、跳过或写下自己的问题。</div><div class="grid2">${[['身体变化与身体形象','手术后身体变化、外观或照镜子时的感受。'],['绝经与生育顾虑','月经、绝经、生育力或相关选择带来的担心。'],['亲密关系与性健康','亲密关系、疼痛、干涩或和伴侣沟通的顾虑。'],['告诉家人和孩子','想不想说、怎么说，以及希望家人提供什么支持。']].map(([topic,desc])=>`<section class="card"><h3>${topic}</h3><p class="small muted">${desc}</p><div class="actions">${btn('写一条私密记录','private-topic-note','quiet small',`data-topic="${topic}"`)}${btn('准备一个就诊问题','private-topic-question','quiet small',`data-topic="${topic}"`)}</div></section>`).join('')}</div><p class="small muted">页面不提供性健康、绝经或生育医疗处置建议；可以把你选择的问题带给专业团队讨论。</p>`;
 return heading('心理支持','你不需要把感受整理好，才可以说出来。')+tabs(['当下感受','我的记录','支持资源','身体与亲密'],tab,'mind')+body;
}

function care(){return `${heading('全程管理','先记下已经确定的安排，或自己想做的一件小事。')}<div class="grid2"><section class="card"><h2>未来安排</h2>${ui.tasks.length?ui.tasks.map((t,i)=>`<div class="line-row"><span>${esc(t)}</span>${btn('完成','complete-task','small',`data-index="${i}"`)}</div>`).join(''):'<div class="empty">还没有安排。不会自动生成治疗或检查日程。</div>'}<div class="note">完成安排不等于实际给药；演示不提供关闭应用后的后台通知。</div></section><section class="card"><h2>添加一件事</h2><form id="taskForm"><label class="field">事项<input name="title" placeholder="例如：把最担心的问题带去沟通"></label><label class="field">日期（可选）<input type="date" name="date"></label>${btn('保存安排','save-task','primary','type="submit"')}</form></section></div>`}
function review(){
 const tab=ui.reviewTab||'问题清单';let body='';
 if(tab==='问题清单')body=`<section class="card"><div class="section-head"><div><h2>准备和专业团队讨论</h2><p class="small muted">问题可以来自报告、治疗、营养、身体感受或你自己的担心。</p></div>${btn('添加一个问题','questions','primary small')}</div>${questionList()}<div class="note">依赖未核对资料的问题会保留状态，不会伪装成已确认事实。</div>${btn('预览复诊材料','brief','quiet small')}</section>`;
 else if(tab==='已保留结果')body=`<div class="grid2"><section class="card"><h2>收藏的页面入口</h2>${ui.viewSaved?`<div class="line-row"><div><strong>病情一图秀</strong><div class="small muted">收藏的是页面入口，不是数据快照；打开后按当前记录重新显示。</div></div>${btn('重新打开','navigate','quiet small','data-page="onepage"')}${btn('取消收藏','remove-view','quiet small')}</div>`:'<div class="empty">还没有收藏的页面入口。可以在病情一图秀中收藏入口。</div>'}</section><section class="card"><h2>解释与资料对照</h2><div class="empty"><p>此独立原型不连接 AI 或真实临床数据库，因此没有真实解释结果；DSH Desktop 产品版将由左侧原生 Agent 对话提供解释协作。</p><p class="small">以后只有你主动保留的结果才会出现在这里，并显示来源与版本。</p></div></section></div>`;
 else body=`<div class="grid2"><section class="card"><h2>报告与资料</h2>${docs.map(d=>`<div class="line-row"><div><strong>${esc(d.name)}</strong><div class="small muted">${esc(d.date)} · ${esc(d.type)} · ${esc(d.status)}</div></div>${source(d.id,'查看')}</div>`).join('')}${ui.exports.length?`<h3 style="margin-top:18px">已生成的演示文件</h3>${ui.exports.map(x=>`<div class="line-row">${esc(x)} ${pill('本次演示')}</div>`).join('')}`:'<p class="small muted">尚无已生成文件。正式 PDF / DOCX / 图片导出未接入。</p>'}</section><section class="card"><h2>我的安排</h2>${ui.tasks.length?ui.tasks.map((t,i)=>`<div class="line-row"><div><strong>${esc(t)}</strong><div class="small muted">本人添加；完成安排不会自动写成实际治疗。</div></div>${btn('完成','complete-task','quiet small',`data-index="${i}"`)}</div>`).join(''):'<div class="empty">还没有安排。你可以在全程管理中记下一件想做的事。</div>'}${btn('添加一项个人安排','navigate','quiet','data-page="care"')}</section></div>`;
 return heading('收藏与回顾','把问题、已保留入口、报告和个人安排放在需要时找得到的地方。')+tabs(['问题清单','已保留结果','报告与任务'],tab,'review')+body;
}

function draftExcerpt(){return [ui.accepted?'': '10-14 CA125 71 U/mL【未核对】 · 模拟来源d1','影像比较日期未知 · 模拟来源d2',ui.clarified?'治疗已标为计划、无实际给药记录 · 模拟来源d3':'治疗计划/实际尚待区分【未核对】 · 模拟来源d3'].filter(Boolean).join('；')}
function unresolvedText(){return ui.clarified?'影像比较对象待核实；治疗已标为计划，暂无实际给药资料。':'影像比较对象与治疗计划/实际状态仍待核实。'}
function briefBody(inDialog=true){return `<div class="note">复诊准备预览 · 所有数据均为模拟。默认不带未核对摘录或私密心理内容。</div><h3>这次想先讨论的事</h3>${ui.questions.length?`<ol>${ui.questions.filter(q=>q.state!=='candidate').map(q=>`<li>${esc(q.text)}</li>`).join('')}</ol>`:'<p class="muted">你可以先从报告整理或自己的疑问中保留一条问题。</p>'}<h3>已接受记录</h3><p>CA125：${MockAdapter.observations().map(o=>`${o.date} ${o.value} U/mL`).join('；')}（模拟）。不对变化作医学结论。</p><h3>暂不明确的部分</h3><p class="muted">${unresolvedText()}</p><label class="status-toggle"><input type="checkbox" id="includeDraft">明确选入未核对草稿摘录及其派生内容</label><div id="includedDraft" class="hidden note amber">${draftExcerpt()}。导出保留这些标签与出处。${source('d1')}</div><div class="block-actions">${btn('下载模拟 Markdown','download','primary')}<span class="small muted">PDF / DOCX / JPEG / HTML 正式导出尚未接通</span></div>${inDialog?'':btn('查看问题清单','questions','quiet')}`}
function settingsBody(){const s=ui.settingsDraft||ui.settings;return `<section class="settings-section"><h3>患者资料目录</h3><p>患者报告、病情记录和复诊材料保存在你选择的本机目录。</p><div class="setting-row"><div><strong>当前资料目录</strong><small>${s.dataRoot?esc(s.dataRoot):'尚未选择资料目录（原型演示）'}</small></div><span class="setting-state ${s.dataRoot?'':'pending'}">${s.dataRoot?'演示目录已选':'未绑定'}</span></div><div class="actions">${btn(s.dataRoot?'更换目录':'选择资料目录','settings-dir','small')}</div><p class="settings-note settings-warning">更换目录不会自动搬迁或删除旧目录中的资料。正式产品需另设备份、迁移预览与校验流程。此处仅模拟选择，不访问本机文件。</p></section><section class="settings-section"><h3>报告解析与 MinerU</h3><p>选择扫描件/图片的处理方式。TXT、MD、CSV 等支持类型可在本机解析。</p><div class="setting-choice"><label><input type="radio" name="parseMode" data-setting="parseMode" value="mineru" ${s.parseMode==='mineru'?'checked':''}><span><strong>MinerU 云端解析（默认）</strong><small>社区共享API凭据状态：${s.credentialSource==='community'?'已配置 · 默认可用（仅显示状态）':'当前使用自备凭据（演示）'}</small></span></label><label><input type="radio" name="parseMode" data-setting="parseMode" value="local" ${s.parseMode==='local'?'checked':''}><span><strong>仅本机解析</strong><small>不将报告发送到外部服务；部分扫描件/图片可能无法识别。</small></span></label></div><div class="setting-row"><div><strong>MinerU API 凭据</strong><small>${s.credentialSource==='community'?'使用社区共享凭据；密钥不会显示或返回。':'自备凭据已配置（演示状态）；密钥不会显示。'}</small></div><span class="setting-state">${s.credentialSource==='community'?'社区共享':'本机凭据'}</span></div><input class="setting-password-mock" type="password" disabled aria-label="原型不收集真实密钥" placeholder="原型不接收真实 Token；正式产品在此安全输入/替换"><div class="actions" style="margin-top:10px">${btn(s.credentialSource==='community'?'模拟配置自备 Token':'模拟恢复社区默认','settings-token','small')}</div><a href="https://mineru.net" target="_blank" rel="noreferrer">如何申请 MinerU Token ↗</a><div class="setting-choice"><label><input type="checkbox" data-setting="cloudConsent" ${s.cloudConsent?'checked':''}><span><strong>我了解云端解析会将所选文件发送到 MinerU</strong><small>保存偏好不代替每份文件发送前的确认；患者档案、心理记录和问题不会随设置上传。</small></span></label></div><p class="settings-note settings-warning">社区共享服务可能有额度、限流或可用性变化。上传失败时保留原件，可切换本地解析或稍后重试。</p></section><section class="settings-section"><h3>临床参考与研究数据包</h3><p>医学参考包与患者病历分开保存。来源、地区、覆盖范围和更新状态需要一起查看。</p><div class="settings-source-list"><div class="settings-source"><strong>国家卫健委卵巢癌指南</strong><span class="setting-state">范围核对资料</span><small>中国 · 2022版 · 本项目用于范围核对，不代表已核验最新治疗内容。</small></div><div class="settings-source"><strong>CSCO 卵巢癌指南</strong><span class="setting-state pending">全文待核验</span><small>2025版发布信息已发现；全文和具体建议尚未逐条审核。</small></div><div class="settings-source"><strong>卵巢癌临床试验登记快照</strong><span class="setting-state pending">演示包 · 待接入</span><small>正式内容须显示登记来源、采集日期、覆盖范围和错误状态。</small></div></div><div class="setting-row"><div><strong>临床数据包目录</strong><small>${s.referenceRoot?esc(s.referenceRoot):'与患者资料目录分开管理；原型尚未配置'}</small></div><button class="btn small" data-action="settings-ref-dir">${s.referenceRoot?'更换目录':'查看目录设置'}</button></div></section><section class="settings-section"><h3>隐私与工作台</h3><p>设置凭据与患者病历分开保存。Desktop 管理模型、模式、工具权限和快捷键；小巢宝不替代平台设置。</p><p class="small muted">小巢宝卵巢癌工作台 · v3 交互原型 · 所有配置只保存在当前页面内存，刷新即清除。</p></section>`}
function openSettings(){if(!ui.settingsDraft)ui.settingsDraft={...ui.settings};if($('dialog').open)$('dialog').close();modal('工作台设置',settingsBody(),btn('取消','settings-cancel','quiet')+btn('保存设置','settings-save','primary'));$('dialog').classList.add('settings-dialog')}

function render(){ $('nav').innerHTML=navItems.map(([id,label,icon])=>`<button class="${ui.page===id||ui.page==='organize'&&id==='records'||ui.page==='first'&&id==='home'?'active':''}" data-action="navigate" data-page="${id}" ${ui.page===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${label}</button>`).join('');$('crumb').textContent=navItems.find(n=>n[0]===ui.page)?.[1]||(ui.page==='first'?'刚确诊 · 下一步':'资料整理');$('questionCount').textContent=ui.questions.length;const rootStatus=$('dataRootStatus');if(rootStatus){rootStatus.textContent=ui.settings.dataRoot?'资料目录 · 已选择（演示）':'资料目录 · 原型未绑定';rootStatus.setAttribute('aria-label',rootStatus.textContent+'，打开设置')}$('main').innerHTML=base()+({home,first,organize,records,onepage,clinical,nutrition,mind,care,review}[ui.page]||home)() }
const presetQuestions=['请帮我核实这次检验结果及其与以往记录是否可比。','这次影像报告是与哪次检查比较？我应关注报告中的哪些已明确信息？','哪些资料还需要补齐，才能与团队讨论下一步？'];

function assistant(kind='clinical'){const title=kind==='nutrition'?'整理进食变化，准备讨论':kind==='mind'?'把此刻的担心，慢慢说清楚':'理解资料，准备下一步讨论';modal(title,`<div class="agent-empty"><strong>DSH 原生 Agent 对话</strong><p class="small">正式工作台默认先显示完整业务内容。点击打开后，在同一工作台内嵌入 DSH Desktop 提供的原生对话窗口；可拖动调宽、隐藏后再打开。此 HTML 预览不伪造聊天内容。</p><div class="actions"><button class="primary" data-action="assist-open-native-preview">打开 AI 对话</button><label class="small">对话区宽度 <input id="assist-width" type="range" min="25" max="65" value="42" aria-label="调整 AI 对话区域宽度"></label><output id="assist-width-value">42%</output></div></div><section id="assist-native-preview" class="agent-empty" style="width:var(--agent-width,42%);min-width:240px;max-width:100%;transition:width .15s" hidden><strong>DSH 原生对话窗口位置</strong><p class="small">这里由 DSH Desktop 渲染原生 Agent、模型选择器和发送控件。预览无法调用宿主服务，也不会伪造消息。</p><button data-action="assist-hide-native-preview">× 隐藏对话</button></section><h3 style="margin-top:20px">本次想得到的帮助</h3><p>${kind==='nutrition'?'整理我选择的进食和体重记录，解释相关通用知识，并列出向营养专业人员讨论的问题。':kind==='mind'?'帮助我表达担心和需要的支持。只有我主动选择的私密内容才能进入本次任务。':'把本批资料中的已知/未核对信息分开，解释原文与相关知识，列出值得和团队讨论的选项及缺项。'}</p><h3>分享范围</h3><p class="small muted">演示中仅为任务草稿；不附全量病历、家族信息或私密记录。不把未核对前提当个人医学结论。</p><details><summary>解释结果的结构示例</summary><p class="small">个人资料出处 → 通俗解释与知识来源 → 可讨论选项及适用限制 → 不确定信息 → 可保留的问题。</p></details><h3>发给 DSH Agent 的讨论内容</h3><textarea id="assistant-question" maxlength="1200" aria-label="讨论提纲" style="width:100%;min-height:92px">请用通俗语言说明目前哪些是已知信息、哪些仍不确定；如涉及医学解释，请注明可核查的指南/权威来源、版本、地区和适用条件，并整理我可以与专业团队讨论的问题。不要诊断或替专业团队决定医疗处置。</textarea><p class="small muted">正式工作台需本人明确同意后才会把所选内容一键发送到原生对话；已有草稿或附件时会阻止混发。也可复制到原生输入框继续编辑。</p>`,btn('复制讨论提纲','copy-assist','primary')+btn('保留为复诊问题','save-assist','quiet'))}
function download(){const include=document.getElementById('includeDraft')?.checked;const text='# 小巢宝复诊准备 · 交互演示\n\n所有记录均为模拟，不用于诊疗。\n\n## 想问的问题\n'+ui.questions.filter(q=>include||q.state!=='candidate').map(q=>'- '+q.text+(q.state==='candidate'?'【依赖未核对资料】':'')).join('\n')+'\n\n## 已接受转录（模拟）\n'+MockAdapter.observations().map(o=>'- '+o.date+' CA125 '+o.value+' U/mL；模拟来源 '+o.source).join('\n')+'\n\n## 仍需核实或补充\n'+unresolvedText()+'\n'+(include?'\n## 用户明确选入的草稿摘录（保留当前核对状态）\n'+draftExcerpt()+'\n':'');const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='小巢宝-模拟复诊准备.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);ui.exports.push('模拟Markdown · '+new Date().toLocaleTimeString('zh-CN'));toast('已生成模拟Markdown，所有状态标签保留')}
